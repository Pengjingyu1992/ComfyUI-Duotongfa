name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python -m compileall -q .
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common secrets and private paths
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=.git --exclude='ci.yml' '(sk-[A-Za-z0-9_-]{16,}|BEGIN [A-Z ]*PRIVATE KEY|/Users/[^/]+/|[A-Za-z]:\\Users\\[^\\]+\\)' .
